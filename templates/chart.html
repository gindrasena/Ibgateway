
<!doctype html>
<html>
<head>
  <title>{{ symbol }} • Chart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="container-fluid py-3">
<div class="container">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h3 class="mb-0">15m Chart</h3>
      <div class="text-muted small">Candles + EMA200 + SuperTrend(10,3) + ATR14</div>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-secondary" href="/">Back</a>
      <button class="btn btn-sm btn-primary" onclick="loadChart()">Refresh</button>
    </div>
  </div>

  <div class="row mt-3 g-3 align-items-end">
    <div class="col-12 col-md-5">
      <label class="form-label mb-1">Symbol</label>
      <select id="symbolSelect" class="form-select">
        {% for s in symbols %}
          <option value="{{ s }}" {% if s == symbol %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
      <div class="form-text">Configured via <code>SYMBOLS</code> in <code>.env</code> (max 20).</div>
    </div>
    <div class="col-12 col-md-7">
      <div class="text-muted small">
        Signal options:
        <span class="badge text-bg-light border">BUY {{ 'ON' if allow_buy else 'OFF' }}</span>
        <span class="badge text-bg-light border">SELL {{ 'ON' if allow_sell else 'OFF' }}</span>
      </div>
    </div>
  </div>

  <div class="row mt-3 g-3">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div id="priceChart" style="height: 520px;"></div>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div id="atrChart" style="height: 220px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function currentSymbol() {
  const el = document.getElementById('symbolSelect');
  return el ? el.value : "{{ symbol }}";
}

document.getElementById('symbolSelect').addEventListener('change', () => {
  const s = currentSymbol();
  window.location.href = `/chart/${s}`;
});

async function loadChart() {
  const sym = currentSymbol();
  const resp = await fetch(`/api/chart/${sym}?bars=240`);
  const data = await resp.json();

  const t = data.t;

  const candles = {
    type: 'candlestick',
    x: t,
    open: data.open,
    high: data.high,
    low: data.low,
    close: data.close,
    name: 'Price',
    increasing: { line: { color: '#16a34a' } },
    decreasing: { line: { color: '#dc2626' } }
  };

  const ema200 = {
    type: 'scatter',
    x: t,
    y: data.ema200,
    mode: 'lines',
    name: 'EMA200',
    line: { color: '#2563eb', width: 2 }
  };

  const stLine = {
    type: 'scatter',
    x: t,
    y: data.st,
    mode: 'lines',
    name: 'SuperTrend',
    line: { color: '#111827', width: 2, dash: 'dot' }
  };

  const layout = {
    title: { text: `${data.symbol} • ${data.timeframe}`, font: { size: 14 } },
    margin: { l: 40, r: 20, t: 40, b: 40 },
    xaxis: { rangeslider: { visible: false } },
    yaxis: { title: 'Price' },
    legend: { orientation: 'h' }
  };

  Plotly.newPlot('priceChart', [candles, ema200, stLine], layout, {displayModeBar: true, responsive: true});

  const atrTrace = {
    type: 'scatter',
    x: t,
    y: data.atr14,
    mode: 'lines',
    name: 'ATR14',
    line: { color: '#7c3aed', width: 2 }
  };

  const atrLayout = {
    margin: { l: 40, r: 20, t: 10, b: 40 },
    yaxis: { title: 'ATR' },
    legend: { orientation: 'h' }
  };

  Plotly.newPlot('atrChart', [atrTrace], atrLayout, {displayModeBar: false, responsive: true});
}

loadChart();
</script>
</body>
</html>
